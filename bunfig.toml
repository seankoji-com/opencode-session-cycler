[test]
# Headless JSX: stub @opentui/solid's runtime so plugin components render as
# inspectable plain objects under `bun test` (no terminal renderer needed).
preload = ["./test/preload.ts"]
# Reporters: text for humans/threshold enforcement, lcov for Codecov upload.
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
# Exclude test setup files from coverage (preload.ts mocks modules but isn't tested)
coverageExclude = ["**/test/preload.ts", "test/**"]
# Per-file thresholds. Lines are held at 100%; functions get headroom because
# Bun counts synthetic class entries that cannot be "covered".
coverageThreshold = { lines = 1.0, functions = 0.85 }
