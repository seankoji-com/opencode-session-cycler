name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Release type"
        required: true
        type: choice
        default: "bugfix"
        options:
          - breaking
          - minor
          - bugfix

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Skip the redundant tag-push run when the tag was just pushed by the
    # dispatch path below (that push is attributed to seankoji-com-ci[bot]).
    if: github.event_name == 'workflow_dispatch' || github.actor != 'seankoji-com-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

      - name: Generate seankoji-com-ci App token
        if: github.event_name == 'workflow_dispatch'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SEANKOJI_CI_APP_ID }}
          private-key: ${{ secrets.SEANKOJI_CI_PRIVATE_KEY }}
          owner: seankoji-com
          repositories: opencode-session-cycler

      # Dispatch path: bump the version, push straight to main, tag, publish.
      # seankoji-com-ci is an "always" bypass_actor on both org rulesets (the
      # required-PR rule and the CodeQL-required rule this repo can never
      # satisfy, since it runs no CodeQL) -- pushing directly as that App
      # needs no branch/PR/merge dance. typecheck and test already ran above,
      # so this isn't skipping real verification, just an unsatisfiable
      # required check.
      - name: Bump version, push to main, tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Run the dispatch against the main branch." >&2
            exit 1
          fi

          case "$BUMP" in
            breaking) LEVEL="major" ;;
            minor)    LEVEL="minor" ;;
            bugfix)   LEVEL="patch" ;;
            *) echo "::error::unknown release type '$BUMP'" >&2; exit 1 ;;
          esac

          git config user.name "seankoji-com-ci[bot]"
          git config user.email "288827119+seankoji-com-ci[bot]@users.noreply.github.com"

          RAW_VERSION="$(npm version "$LEVEL" --no-git-tag-version)" # e.g. "v0.2.0" or "0.2.0" depending on npm
          NEW_TAG="v${RAW_VERSION#v}"

          git commit -am "chore(release): $NEW_TAG"

          REMOTE="https://x-access-token:${APP_TOKEN}@github.com/seankoji-com/opencode-session-cycler.git"
          git push "$REMOTE" HEAD:main
          git tag "$NEW_TAG"
          git push "$REMOTE" "$NEW_TAG"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 bundles npm 10.x; OIDC trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: bun run build
      - run: npm pack --dry-run

      # No NODE_AUTH_TOKEN: npm authenticates via GitHub OIDC against the
      # trusted publisher configured on npmjs.com (repo + this workflow file).
      - run: npm publish --access public --provenance
